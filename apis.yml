aid: bonsai
name: Bonsai
description: >-
  Bonsai (hellobonsai.com) is an all-in-one business management platform for
  service businesses -- freelancers, agencies, and firms -- consolidating client
  management (CRM, pipeline, proposals, contracts, forms, client portal), project
  management (tasks, Gantt, time tracking, timesheets, resource planning), and
  financial management (invoicing, payments, expenses, bookkeeping, rate cards,
  budgeting and profitability) into one system. Used by 500,000+ small businesses
  globally. Bonsai exposes its programmatic surface through an official hosted MCP
  (Model Context Protocol) server at mcp.hellobonsai.com so AI clients (Claude,
  ChatGPT, Gemini, Cursor, Codex) can act on tasks, projects, deals, contacts,
  time entries and invoices; a public REST API is documented as forthcoming.
  Backed by Matrix Partners.
