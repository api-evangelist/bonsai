  - name: list_tasks
    description: List tasks.
  - name: list_subtasks
    description: List subtasks of a task.
  - name: get_task
    description: Get a single task.
  - name: create_task
    description: Create a task with assignment and due date.
  - name: update_task
    description: Update a task.
  - name: destroy_task
    description: Delete a task.
  - name: list_task_statuses
    description: List available task statuses.
  # Projects
  - name: list_projects
