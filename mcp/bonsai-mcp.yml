generated: '2026-07-18'
method: searched
status: published
source: https://docs.hellobonsai.com/
description: >-
  Bonsai operates an official hosted/remote MCP (Model Context Protocol) server
  at https://mcp.hellobonsai.com/mcp, letting AI clients (Claude, Claude Code,
  Cursor, Codex, ChatGPT, Gemini, Microsoft Copilot and other HTTP MCP clients)
  act on a user's Bonsai account. Authentication is OAuth 2.1 authorization-code
  flow with PKCE handled by the AI client -- there are no API keys to create; the
  MCP server never receives passwords and passes a short-lived (15 minute,
  auto-refreshed) token through to Bonsai, acting strictly within the user's
  existing Bonsai role. Parameter-level detail is slated for a future public REST
  API reference. Tool list captured from the Bonsai MCP documentation.
server:
  name: bonsai
  transport: http
  url: https://mcp.hellobonsai.com/mcp
  auth: oauth2
  auth_detail: OAuth 2.1 authorization-code flow with PKCE; client-driven browser login; token TTL ~15 minutes, auto-refreshed
  docs: https://docs.hellobonsai.com/
connect:
  claude_desktop: "Customize > Connectors > add custom connector with URL https://mcp.hellobonsai.com/mcp"
  claude_code: "claude mcp add bonsai --transport http https://mcp.hellobonsai.com/mcp"
  cursor: "add entry to mcp.json with url https://mcp.hellobonsai.com/mcp"
  codex: "codex mcp add bonsai --url https://mcp.hellobonsai.com/mcp; codex mcp login bonsai"
rate_limit: Up to 10,000 requests every 10 minutes per IP address.
tools:
